# Rendered by docker-entrypoint.sh (envsubst) -> ${NGINX_RUN_DIR}/nginx.conf
${USER_DIRECTIVE}
worker_processes ${WORKER_PROCESSES};
worker_rlimit_nofile ${WORKER_RLIMIT_NOFILE};
pid ${NGINX_RUN_DIR}/nginx.pid;
error_log /dev/stderr ${ERROR_LOG_LEVEL};
${BROTLI_MODULE_CONF}

events {
  worker_connections ${WORKER_CONNECTIONS};
  multi_accept on;
  use epoll;
}

http {
  # Temporary files: writable by any user
  client_body_temp_path ${NGINX_RUN_DIR}/tmp/client_body;
  proxy_temp_path       ${NGINX_RUN_DIR}/tmp/proxy;
  fastcgi_temp_path     ${NGINX_RUN_DIR}/tmp/fastcgi;
  uwsgi_temp_path       ${NGINX_RUN_DIR}/tmp/uwsgi;
  scgi_temp_path        ${NGINX_RUN_DIR}/tmp/scgi;

  ##
  # Basic settings
  ##
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  keepalive_requests 1000;
  types_hash_max_size 4096;
  server_tokens off;
  client_max_body_size ${CLIENT_MAX_BODY_SIZE};

  include ${NGINX_CONF_DIR}/mime.types;
  default_type application/octet-stream;

  # Docker DNS: upstreams are resolved at request time, so nginx starts even if php is not up yet
  resolver ${RESOLVER} valid=10s ipv6=off;

  ##
  # Real client IP (behind Traefik)
  ##
  ${REAL_IP_CONF}

  ##
  # Logging
  ##
  access_log ${ACCESS_LOG};

  ##
  # Maps
  ##
  # Value of the PHP "HTTPS" variable, deduced from the proxy header (HTTPS=auto)
  map $http_x_forwarded_proto $forwarded_https {
    default off;
    https   on;
  }

  # Cache-Control of static files: 1 year only when the file name contains a hash
  # (app.3f2a9c1b.js, app-3f2a9c1b.css), otherwise CACHE_STATIC_MAX_AGE seconds
  map $uri $static_cache_control {
    default "public, max-age=${CACHE_STATIC_MAX_AGE}";
    "~*[.-][0-9a-f]{8,}\.[a-z0-9]+$" "public, max-age=31536000, immutable";
  }

  ##
  # Compression
  ##
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_min_length 512;
  gzip_types
    text/plain text/css text/javascript application/javascript application/x-javascript
    application/json application/ld+json text/xml application/xml application/atom+xml
    application/rss+xml application/vnd.ms-fontobject application/font-woff application/font-woff2
    application/x-font-opentype application/x-font-ttf font/opentype font/ttf font/otf
    image/svg+xml image/x-icon text/csv application/csv;
  ${BROTLI_CONF}

  ##
  # Virtual hosts
  ##
  include ${OVERRIDES_DIR}/conf.d/*.conf;
  include ${NGINX_CONF_DIR}/conf.d/*.conf;
  include ${NGINX_RUN_DIR}/sites/*.conf;
}
