# Rendered by docker-entrypoint.sh (envsubst) -> ${NGINX_RUN_DIR}/sites/website.conf  (MODE=php)
server {
  listen ${LISTEN_PORT};
  server_name _;
  server_name_in_redirect off;

  root ${WEBSITE_ROOT}/${PUBLIC_DIR};
  index index.html ${PHP_FRONT_SCRIPT};

  include ${NGINX_RUN_DIR}/snippets/security-headers.conf;
  include ${NGINX_RUN_DIR}/snippets/error-pages.conf;

  # Extra directives / locations of the project: /overrides/server.d/*.conf
  include ${OVERRIDES_DIR}/server.d/*.conf;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Hidden files (.git, .env, .htaccess...), except /.well-known/
  location ~ /\.(?!well-known(?:/|$)) {
    access_log off;
    log_not_found off;
    return 404;
  }

  # No script execution from upload directories
  location ~* ^/(?:wp-content/uploads|uploads?|upload)/.+\.(?:php\d?|phtml|phar)$ {
    return 404;
  }

  # Static files: served if they exist, otherwise handled by the application
  # (dynamic robots.txt, generated images, ...)
  location ~* \.(?:css|js|mjs|map|webp|avif|jpe?g|png|gif|svg|ico|woff2?|ttf|otf|eot|txt|srt|swf|mp4|webm|mp3|pdf|json|xml)$ {
    try_files $uri /${PHP_FRONT_SCRIPT}$is_args$args;
    include ${NGINX_RUN_DIR}/snippets/static-headers.conf;
  }

  # HTML: always revalidated
  location ~* \.html?$ {
    try_files $uri /${PHP_FRONT_SCRIPT}$is_args$args;
    include ${NGINX_RUN_DIR}/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  location / {
    try_files $uri $uri/ /${PHP_FRONT_SCRIPT}$is_args$args;
  }

  include ${NGINX_RUN_DIR}/snippets/php-location.conf;
}
