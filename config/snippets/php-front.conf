# PHP_MODE=front: only the front controller (PHP_FRONT_SCRIPT, internal) and the scripts
# listed in PHP_ALLOWED_SCRIPTS are executed. Every other .php URL returns 404.
${PHP_ALLOWED_CONF}

location ~ ^/${PHP_FRONT_SCRIPT_RE}(?:/|$) {
  fastcgi_split_path_info ^(.+?\.php)(/.*)$;
  internal;
  include ${NGINX_RUN_DIR}/snippets/fastcgi-php.conf;
}
location ~ \.php(?:/|$) {
  return 404;
}
