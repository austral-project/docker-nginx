# Headers of static files served directly (add_header is not inherited, so everything is repeated here)
include ${NGINX_RUN_DIR}/snippets/security-headers.conf;
add_header Access-Control-Allow-Origin "${CORS_ALLOW_ORIGIN}" always;
add_header Access-Control-Expose-Headers "Content-Type, Content-Range, Content-Disposition, Content-Description, Content-Length" always;
add_header Austral "Direct-Link" always;
add_header Cache-Control $static_cache_control always;
